name: Build iPhone App (IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Build PhoneCam Pro IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (web assets -> iOS)
        run: npx cap sync ios

      - name: Build unsigned archive (for sideloading)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/PhoneCamPro.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa (unsigned, ready for Sideloadly/AltStore)
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R "build/PhoneCamPro.xcarchive/Products/Applications/App.app" build/ipa/Payload/PhoneCamPro.app
          cd build/ipa
          zip -r ../PhoneCamPro-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCamPro-ipa
          path: build/PhoneCamPro-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA as stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete test-build --yes 2>/dev/null || true
          gh release create test-build build/PhoneCamPro-unsigned.ipa \
            --title "PhoneCam Pro - build de prueba" \
            --notes "IPA sin firmar para sideload (Sideloadly / AltStore / SideStore). Instalar no requiere Mac." \
            2>&1 || true

      - name: Summary
        run: |
          echo "::notice::App built! Download the PhoneCamPro-ipa artifact and sideload it with Sideloadly or AltStore using your Apple ID."